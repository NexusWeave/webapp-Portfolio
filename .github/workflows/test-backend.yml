name: Automatic Backend Test

on:
  workflow_run:
    workflows: ["Backend Quality Check"]
    types:
      - completed
    branches:
      - '**'

jobs:
  test-backend:
    name: Run Unit Tests (Backend)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Run Tests
        run: uv run pytest
