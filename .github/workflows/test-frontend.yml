name: Automatic Frontend Test

on:
  workflow_run:
    workflows: ["Frontend Quality Check"]
    types:
      - completed
    branches:
      - '**'

jobs:
  test-frontend:
    name: Run Unit Tests (Frontend)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
