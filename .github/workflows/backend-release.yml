name: Backend Release

on:
  workflow_run:
    workflows: ["Automatic Backend Test"]
    types:
      - completed

    branches:
      - main

jobs:
  backend-release:
    name: Backend Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for Backend Changes
        id: backend-changes
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git diff --quiet "${HEAD_SHA}^" "${HEAD_SHA}" -- backend; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.backend-changes.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Commitizen
        if: steps.backend-changes.outputs.changed == 'true'
        run: python -m pip install --upgrade commitizen

      - name: Bump Backend Version
        if: steps.backend-changes.outputs.changed == 'true'
        working-directory: backend
        run: |
          cz bump --yes --changelog || [ $? -eq 21 ]

      - name: Push Backend Release
        if: steps.backend-changes.outputs.changed == 'true'
        run: |
          git pull --rebase origin main
          git push origin main --follow-tags
