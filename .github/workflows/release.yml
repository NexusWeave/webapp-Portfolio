name: Root Release

on:
  workflow_run:
    workflows: ["Frontend Release", "Backend Release"]
    types:
      - completed
    branches:
      - main

jobs:
  root-release:
    name: Update Root Major Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate Root Major Changelog
        run: python scripts/generate_root_changelog.py

      - name: Commit and Push Root Changelog
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No new major changes to root CHANGELOG.md"
          else
            git add CHANGELOG.md
            git commit -m "chore(changelog): update root CHANGELOG.md for major changes [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
