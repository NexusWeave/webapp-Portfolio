[project]
name = "Portfolio"
version = "2.30.2"
dependencies = [
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.7.0",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.0",
    "sqlAlchemy>=2.0.51",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "simplified-logging>=1.3",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.52.0",
    "fastAPI[standard]>=0.141.0"
]

requires-python = ">=3.12"

# Developer dependencies
[dependency-groups]
dev = [
    "uv>=0.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-metadata>=3.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=5.2.0",
]


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "backend-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

addopts = [
    "--strict-markers",
    "--import-mode=importlib"
]
markers = [ "integration: marker for integration services"]

asyncio_mode = "auto"

[tool.coverage.run]
source = ["."] 
omit = [".venv/*"]


[tool.coverage.report]

show_missing = true

[tool.uv]
pip.compile-command = "uv pip compile requirements.in -o requirements.txt"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v -o cache_dir=/tmp/.pytest_cache"
norecursedirs = [".git", ".venv", "data", "logs"]

# Forberedelse for framtidige Astral 'ty' / type-checking regler
[tool.ty]
# Når Astral slipper ty konfigurasjonsskjema vil innstillinger defineres her
python_version = "3.12"