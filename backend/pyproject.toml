[project]
name = "Portfolio"
version = "2.30.2"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.7.0",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.0",
    "sqlAlchemy>=2.0.51",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "simplified-logging>=1.3",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.52.0",
    "fastAPI[standard]>=0.141.0",
    "types-aiofiles>=25.1.0.20260518",
]

# Developer dependencies
[dependency-groups]
dev = [
    "uv>=0.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-metadata>=3.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=5.2.0",
]

[tool.commitizen]

asyncio_mode = "auto"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
name = "cz_conventional_commits"
tag_format = "backend-v$version"
addopts = [ "--strict-markers", "--import-mode=importlib"]
markers = [ "integration: marker for integration services"]

[tool.coverage.run]
source = ["."] 
omit = [".venv/*"]

[tool.coverage.report]
show_missing = true

[tool.uv.pip]
custom-compile-command = "uv pip compile requirements.in -o requirements.txt"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP"]


[tool.mypy]
mypy_path = "."
check_untyped_defs = false
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -o cache_dir=/tmp/.pytest_cache"
norecursedirs = [".git", ".venv", "data", "logs"]

[tool.ty]
python_version = "3.12" # Define Astral configuration schema 
