[tool.commitizen]
name = "cz_conventional_commits"
version = "1.1.0-1" 
version_scheme = "pep440"
version_provider = "commitizen"
tag_format = "python-v$version"

[tool.pytest.ini_options]
pythonpath = ["."]

addopts = [
    "--strict-markers",
    "--import-mode=importlib"
]
markers = [ "integration: marker for integration services"]

asyncio_mode = "auto"

[tool.coverage.run]
source = ["."] 
omit = [".venv/*"]


[tool.coverage.report]

show_missing = true

[tool.uv]
pip.compile-command = "uv pip compile requirements.in -o requirements.txt"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

# Forberedelse for framtidige Astral 'ty' / type-checking regler
[tool.ty]
# Når Astral slipper ty konfigurasjonsskjema vil innstillinger defineres her
python_version = "3.12"